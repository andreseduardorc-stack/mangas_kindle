<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2c2b29" />
    <meta name="description" content="Lector de mangas y cómics en español con menús, estética de tinta electrónica (E-Ink) y ergonomía de Amazon Kindle Paperwhite." />

    <!-- iOS / Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KindleManga" />

    <!-- Android / Chrome PWA support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="KindleManga" />
    <meta name="msapplication-TileColor" content="#2c2b29" />

    <title>Kindle Manga & Manhwa Reader (Español)</title>
  </head>
  <body class="bg-[#2c2b29] text-[#1a1918]">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>

    <!-- Register Service Worker for PWABuilder & Offline support -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js')
            .then((reg) => {
              console.log('[PWA] Service Worker registrado exitosamente:', reg.scope);
            })
            .catch((err) => {
              console.warn('[PWA] Error al registrar Service Worker:', err);
            });
        });
      }
    </script>
  </body>
</html>
