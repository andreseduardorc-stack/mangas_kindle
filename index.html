<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Lector de mangas y cómics en español con menús, estética de tinta electrónica (E-Ink) y ergonomía de Amazon Kindle Paperwhite." />

    <title>Kindle Manga &amp; Manhwa Reader (Español)</title>
  </head>
  <body class="bg-[#2c2b29] text-[#1a1918]">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>

    <!--
      Esto era una PWA instalable y ya no lo es. Quien la instalase en su
      momento tiene un Service Worker registrado que seguiría sirviendo la
      versión vieja desde caché para siempre, así que aquí se desregistra y se
      borra lo que dejó. Se puede quitar cuando nadie arrastre ya la instalación.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then((regs) => Promise.all(regs.map((r) => r.unregister())))
          .catch(() => {});
      }
      if (window.caches && caches.keys) {
        caches
          .keys()
          .then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
          .catch(() => {});
      }
    </script>
  </body>
</html>
